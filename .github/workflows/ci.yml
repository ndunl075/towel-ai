name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm test

      - name: Build
        run: npm run build
        env:
          # The build must not need credentials. Extraction falls back to the
          # local heuristic extractor when this is unset, which is exactly the
          # path a contributor without a key will hit.
          ANTHROPIC_API_KEY: ""
